<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Analyzer AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f4f7fc 0%, #eef4ff 100%);
    min-height: 100vh;
}

/* Navbar */
.navbar {
    background: linear-gradient(135deg, #0d6efd, #4f8cff);
    box-shadow: 0 4px 20px rgba(13, 110, 253, 0.25);
}

.navbar-brand {
    font-size: 1.3rem;
    font-weight: 700;
    color: white !important;
}

/* Layout */
.container {
    margin-top: 50px;
    margin-bottom: 50px;
}

/* Main Cards */
.card {
    border: none;
    border-radius: 20px;
    background: #ffffff;
    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
    overflow: hidden;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.12),
        0 3px 10px rgba(0, 0, 0, 0.06);
}

/* Form Title */
h3 {
    font-weight: 700;
    color: #1e293b;
}

/* Result Title */
h4 {
    font-weight: 700;
    color: #0d6efd;
    margin-bottom: 20px;
}

/* Labels */
.form-label {
    font-weight: 600;
    color: #334155;
}

/* Inputs */
.form-control {
    border-radius: 12px;
    border: 1px solid #dbe4f0;
    padding: 12px;
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.25rem rgba(13,110,253,.15);
}

/* Button */
.btn-primary {
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    font-size: 1rem;
    background: linear-gradient(135deg, #0d6efd, #4f8cff);
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(13,110,253,.25);
}

/* Spinner */
.spinner {
    margin-top: 25px;
}

.spinner p {
    color: #64748b;
    font-weight: 500;
}

/* Analysis Result */
#markdown-result {
    line-height: 1.9;
    color: #334155;
    font-size: 0.97rem;
}

/* Markdown Headings */
#markdown-result h1,
#markdown-result h2,
#markdown-result h3,
#markdown-result h4 {
    color: #0d6efd;
    font-weight: 700;
    margin-top: 25px;
    margin-bottom: 15px;
}

/* Lists */
#markdown-result ul {
    padding-left: 20px;
}

#markdown-result li {
    margin-bottom: 10px;
}

/* Strong Text */
#markdown-result strong {
    color: #0f172a;
    font-weight: 700;
}

/* Horizontal line */
#markdown-result hr {
    margin: 25px 0;
    border: none;
    height: 1px;
    background: #e2e8f0;
}

/* Code block / terminal style */
pre {
    background: #0f172a;
    color: #f8fafc;
    padding: 20px;
    border-radius: 15px;
    overflow-x: auto;
    font-size: 0.9rem;
}

/* Footer */
.footer {
    margin-top: 60px;
    padding: 25px;
    text-align: center;
    color: #64748b;
    background: transparent;
}

/* Responsive */
@media (max-width: 768px) {
    .card {
        border-radius: 16px;
    }

    h3 {
        font-size: 1.4rem;
    }

    #markdown-result {
        font-size: 0.92rem;
    }
}
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">Resume Analyzer AI</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4">
          <h3 class="mb-4 text-center">Analyze Your Resume with AI</h3>
          <form id="analyzeForm" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Upload Resume (PDF only)</label>
              <input class="form-control" type="file" name="resume" accept=".pdf" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Paste Job Description</label>
              <textarea class="form-control" name="job_description" rows="6" required></textarea>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Analyze Resume</button>
            </div>
          </form>

          <!-- Spinner -->
          <div class="spinner" id="spinner">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Processing...</span>
            </div>
            <p class="mt-2">Analyzing... please wait</p>
          </div>
        </div>

       {% if result %}
<div class="card mt-4 p-4">
    <h4 class="mb-3">📊 Analysis Result</h4>

    <div id="markdown-result"></div>
</div>

<script>
    document.getElementById("markdown-result").innerHTML =
    marked.parse(`{{ result | replace('`', '\\`') | safe }}`);
</script>
{% endif %}
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
   
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Show Spinner on Form Submit -->
  <script>
    const form = document.getElementById("analyzeForm");
    const spinner = document.getElementById("spinner");
    form.addEventListener("submit", function () {
      spinner.style.display = "block";
    });
  </script>

   
</body>
</html>
